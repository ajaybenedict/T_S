<div class="dashboard-wrapper">
  <section class="dashboard-container">
    <div class="header-bar">
      <app-header></app-header>
    </div>

    <div class="search-bar">
      <app-searchbar (searchValue)="onSearchValueChange($event)">
      </app-searchbar>
    </div>

    <div class="navigation-bar">
      <app-navigationbar [hidden]="isAnySelectedOnPage" (typeChanged)="onTabTypeChange($event)"></app-navigationbar>
    </div>

    <div class="data-table-holder">
      <app-table-cell-template></app-table-cell-template>
      <app-dashboardcontent [isLoading]="isLoading"></app-dashboardcontent>
    </div>
    
  </section>
  <div class="pagination-holder"  *ngIf="paginatorInput.total > 0 && !isLoading">
    <nav class="paginator" aria-label="Pagination">
      <app-footer [inputData]="paginatorInput" (pageChangeInfo)="handlePageChange($event.page, $event.pageSize)">
        ></app-footer>
    </nav>
  </div>
</div>
